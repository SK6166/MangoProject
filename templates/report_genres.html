{% extends "layout.html" %}
{% block content %}
<h2>Отчет книги по жанрам(Агрегация)</h2>
<table class="table table-striped">
    <tr><th>Жанр</th><th>Всего книг</th><th>Средний год</th></tr>
    {% for item in data %}
    <tr>
        <td>{{ item._id }}</td>
        <td>{{ item.total_books }}</td>
        <td>{{ "%.1f"|format(item.avg_year) }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
